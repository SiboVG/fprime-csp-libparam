name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure C++ unit tests
        run: cmake -S tests/unit -B build-unit-tests -G Ninja
      - name: Build C++ unit tests
        run: cmake --build build-unit-tests
      - name: Run C++ unit tests
        run: ctest --test-dir build-unit-tests --output-on-failure

  standalone-consumer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check out the tested F Prime revision
        uses: actions/checkout@v7
        with:
          repository: nasa/fprime
          ref: 35d4c0e881482adf372b8eee3eb56ad2dee74618
          path: fprime
          submodules: recursive
          persist-credentials: false
      - name: Install native dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y pkg-config libbsd-dev
      - name: Bootstrap pinned libcsp and libparam
        run: ./scripts/bootstrap_dependencies.sh
      - name: Install F Prime build tools
        run: python -m pip install -r fprime/requirements.txt
      - name: Build the standalone Runtime and Libparam consumer
        run: >-
          ./tests/run_runtime_smoke.sh
          "$GITHUB_WORKSPACE/fprime"
          "$GITHUB_WORKSPACE/lib/libcsp"

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure C++ unit tests with sanitizers
        run: >-
          cmake -S tests/unit -B build-unit-tests-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build C++ unit tests with sanitizers
        run: cmake --build build-unit-tests-sanitized
      - name: Run C++ unit tests with sanitizers
        run: ctest --test-dir build-unit-tests-sanitized --output-on-failure
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install coverage tooling
        run: python -m pip install "gcovr==8.6"
      - name: Configure coverage build
        run: >-
          cmake -S tests/unit -B build-coverage -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DFPRIMECSP_ENABLE_COVERAGE=ON
      - name: Build and run coverage tests
        run: >-
          cmake --build build-coverage &&
          ctest --test-dir build-coverage --output-on-failure
      - name: Enforce production line coverage
        run: >-
          gcovr --root . --object-directory build-coverage
          --filter 'FprimeCsp/' --exclude 'tests/'
          --fail-under-line 80 --xml-pretty --output coverage.xml
          build-coverage
      - uses: actions/upload-artifact@v7
        with:
          name: fprime-csp-libparam-coverage
          path: coverage.xml
          if-no-files-found: error

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install static-analysis tooling
        run: sudo apt-get update && sudo apt-get install -y clang-tidy ninja-build
      - name: Generate compilation database
        run: >-
          cmake -S tests/unit -B build-static-analysis -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Analyze production sources
        run: >-
          clang-tidy --warnings-as-errors=* -p build-static-analysis
          FprimeCsp/Runtime/Stack.cpp
          FprimeCsp/SocketCan/SocketCanTransport.cpp
          FprimeCsp/Libparam/Libparam.cpp
          FprimeCsp/Libparam/libparam_bridge.c

  integration-consumer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out current library revision
        uses: actions/checkout@v7
        with:
          path: fprime-csp-libparam
          persist-credentials: false
      - name: Check out private integration consumer
        uses: actions/checkout@v7
        with:
          repository: SiboVG/CspLibparamFprimeTest
          ssh-key: ${{ secrets.CSPBENCH_DEPLOY_KEY }}
          path: CspLibparamFprimeTest
          persist-credentials: false
      - name: Install Linux integration dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential cmake ninja-build git pkg-config python3-venv
          iproute2 can-utils kmod libsocketcan-dev libbsd-dev
      - name: Install matching virtual CAN kernel module
        run: |
          kernel_release="$(uname -r)"
          extra_package="linux-modules-extra-${kernel_release}"
          candidate="$(apt-cache policy "$extra_package" | sed -n 's/^  Candidate: //p')"
          if [[ -z "$candidate" || "$candidate" == "(none)" ]]; then
            echo "::error::No vcan kernel-module package for running kernel ${kernel_release}: ${extra_package}"
            echo "APT candidate: ${candidate:-none}"
            uname -a
            apt-cache policy "$extra_package" || true
            ls -la "/lib/modules/${kernel_release}" || true
            exit 1
          fi
          sudo apt-get install -y "$extra_package"
          sudo depmod -a "$kernel_release"
          sudo modprobe vcan
          modinfo -F filename vcan
          test -d /sys/module/vcan
      - name: Bootstrap pinned upstream dependencies
        working-directory: CspLibparamFprimeTest
        run: ./scripts/bootstrap_dependencies.sh
      - name: Install F Prime build dependencies
        working-directory: CspLibparamFprimeTest
        run: >-
          python3 -m venv .venv &&
          .venv/bin/python -m pip install --upgrade pip &&
          .venv/bin/python -m pip install -r requirements.txt
      - name: Generate consumer deployment
        working-directory: CspLibparamFprimeTest
        run: >-
          export PATH="$PWD/.venv/bin:$PATH" &&
          .venv/bin/fprime-util generate
          -DPYTHON="$PWD/.venv/bin/python"
      - name: Build consumer deployment
        working-directory: CspLibparamFprimeTest
        run: >-
          export PATH="$PWD/.venv/bin:$PATH" &&
          .venv/bin/fprime-util build
      - name: Create isolated virtual CAN bus
        id: setup-vcan
        working-directory: CspLibparamFprimeTest
        run: sudo ./scripts/setup_vcan.sh up cspvcan0
      - name: Run real consumer integration
        working-directory: CspLibparamFprimeTest
        run: >-
          export CUBESPEC_LOG_DIR="$PWD/integration-logs" &&
          CSP_BENCH_BIN="$(find build-artifacts -type f -name CspBench -perm -111 -print -quit)" &&
          test -n "$CSP_BENCH_BIN" &&
          ldd_output="$(ldd "$CSP_BENCH_BIN")" &&
          printf '%s\n' "$ldd_output" &&
          ! grep -F -q -- "not found" <<<"$ldd_output" &&
          ./scripts/run_vcan_type_matrix.sh "$CSP_BENCH_BIN"
          --interface cspvcan0
      - name: Remove isolated virtual CAN bus
        if: always() && steps.setup-vcan.outcome == 'success'
        working-directory: CspLibparamFprimeTest
        run: >-
          if ip link show cspvcan0 >/dev/null 2>&1; then
          sudo ./scripts/setup_vcan.sh down cspvcan0; fi
      - name: Upload consumer integration logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-vcan-integration-logs
          path: CspLibparamFprimeTest/integration-logs
          if-no-files-found: warn

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run standalone repository contracts
        run: ./tests/run_repository_contracts.sh

  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build documentation
        run: mkdocs build --strict --clean
