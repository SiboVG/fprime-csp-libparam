name: Publish documentation

on:
  workflow_run:
    workflows:
      - Repository checks
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful CI before automatic deployment
        if: github.event_name == 'workflow_run'
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: test "$CI_CONCLUSION" = "success"

      - name: Check out manually selected revision
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure C++ unit tests for manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: cmake -S tests/unit -B build-unit-tests -G Ninja

      - name: Build C++ unit tests for manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: cmake --build build-unit-tests

      - name: Run C++ unit tests for manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: ctest --test-dir build-unit-tests --output-on-failure

      - name: Configure sanitized unit tests for manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: >-
          cmake -S tests/unit -B build-unit-tests-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build sanitized unit tests for manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: cmake --build build-unit-tests-sanitized

      - name: Run sanitized unit tests for manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: ctest --test-dir build-unit-tests-sanitized --output-on-failure
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

      - name: Run repository contracts for manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: ./tests/run_repository_contracts.sh

  build:
    needs: validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build documentation
        run: python -m mkdocs build --strict --clean

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v5
